plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sga.keyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sga.keyboard'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Ditandatangani dengan debug key supaya langsung bisa di-install (pemakaian pribadi)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Tanpa dependency sama sekali = APK sangat kecil
dependencies { }
